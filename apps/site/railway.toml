# Superteam Malaysia site — served at https://my.superteam.fun/
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/"
timeout = 300
