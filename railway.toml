# Repo-root config when Railway builds from monorepo root.
# Prefer setting the service root directory to apps/web in Railway dashboard.
[build]
builder = "NIXPACKS"
buildCommand = "cd apps/web && npm ci && npm run build"
watchPatterns = ["apps/web/**"]

[deploy]
startCommand = "cd apps/web && npm run db:migrate && npm run db:import-guests && npm run db:seed-teams && npm run db:seed-staff && npm run telegram:setup-webhook && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/borneo"
timeout = 300
